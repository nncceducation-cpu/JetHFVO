name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_ORIGIN: https://nncceducation-cpu.github.io
          NEXT_PUBLIC_BASE_PATH: /JetHFVO
        run: pnpm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          cp -R dist/client/JetHFVO/. dist/client/
          rm -rf dist/client/JetHFVO
          touch dist/client/.nojekyll
          test -f dist/client/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
